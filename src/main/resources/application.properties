spring.application.name=realworld

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/realworld}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

jwt.secret=${JWT_SECRET:MkdhNr+BZydYUbnFnTMCd9ddPPVShVdsDT0322Y5hlQvb/Y6gnywB2TcsuqjdAO6AI4SxtV4Kcqduk8YT4SNSg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs

logging.level.dev.dhev.realworld=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
