name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Gradle tests
        run: ./gradlew test

      - name: Start local stack
        run: docker compose up --build -d postgres app

      - name: Run Hurl suite
        run: ./scripts/run-hurl.sh

      - name: Export OpenAPI document
        run: ./scripts/export-openapi.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site

      - name: Stop local stack
        if: always()
        run: docker compose down -v
