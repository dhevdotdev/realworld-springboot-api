name: deploy-docs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CF_PAGES_PROJECT_NAME != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start local stack
        run: docker compose up --build -d postgres app

      - name: Run Hurl suite
        run: ./scripts/run-hurl.sh

      - name: Export OpenAPI document
        run: ./scripts/export-openapi.sh

      - name: Deploy docs site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy docs-site --project-name "${{ vars.CF_PAGES_PROJECT_NAME }}"

      - name: Stop local stack
        if: always()
        run: docker compose down -v
